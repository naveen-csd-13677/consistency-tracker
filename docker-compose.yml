version: '3.8'\n\nservices:\n  backend:\n    image: tiangolo/uvicorn-gunicorn-fastapi:python3.8\n    ports:\n      - '8000:80'\n    volumes:\n      - './backend:/app'\n    environment:\n      - DATABASE_URL=postgresql://user:password@db:5432/dbname\n\n  frontend:\n    build: ./frontend\n    ports:\n      - '3000:3000'\n    volumes:\n      - './frontend:/app'\n\n  db:\n    image: postgres:latest\n    volumes:\n      - db_data:/var/lib/postgresql/data\n    environment:\n      - POSTGRES_USER=user\n      - POSTGRES_PASSWORD=password\n      - POSTGRES_DB=dbname\n\nvolumes:\n  db_data: